[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.lints.rust]
unused_qualifications = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
