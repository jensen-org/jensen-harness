[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/promote", "crates/extensions", "crates/testkit-mcp", "crates/testkit-lsp", "crates/workflow", "crates/cli"]
default-members = [".", "crates/protocol", "crates/core", "crates/promote", "crates/extensions", "crates/testkit-mcp", "crates/workflow", "crates/cli"]

# The workspace root is also an ordinary package, whose only purpose is to
# hold the one tests/ directory every crate's tests live in: production
# directories carry no #[cfg(test)] module, matching Jensen's own rule
# ("Tests live in backend/tests/integration/<slice>_<subject>.rs ... no
# #[cfg(test)] module, no mod tests and no tests.rs"), applied here at the
# workspace root since no one crate is as dominant as backend is in Jensen.
[package]
name = "jensen-harness-tests"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
jensen-harness = { path = "crates/cli" }
jensen-harness-core = { path = "crates/core" }
jensen-harness-protocol = { path = "crates/protocol" }
jensen-harness-promote = { path = "crates/promote" }
jensen-harness-extensions = { path = "crates/extensions" }
jensen-harness-workflow = { path = "crates/workflow" }
async-trait = "0.1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
keyring-core = "1"
rusqlite = "0.40"
tracing = "0.1"
tracing-subscriber = "0.3"
dagrs = "0.9"
tokio-util = "0.7"
base64 = "0.23"
proptest = "1"

[lints]
workspace = true

[workspace.package]
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.lints.rust]
unused_qualifications = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
