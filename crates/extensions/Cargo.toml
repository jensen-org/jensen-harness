[package]
name = "jensen-harness-extensions"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
jensen-harness-core = { path = "../core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread"] }
rmcp = { version = "3.5.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
cap-std = "4"
async-lsp = "0.2.4"
tower = "0.5.3"
tracing = "0.1.44"
tokio-util = { version = "0.7.20", features = ["compat"] }

[lints]
workspace = true
