[package]
name = "jensen-harness-extensions"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
jensen-harness-core = { path = "../core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
thiserror = "2"
rmcp = { version = "3.5.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
cap-std = "4"

[lints]
workspace = true
