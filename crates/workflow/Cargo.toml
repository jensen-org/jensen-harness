[package]
name = "jensen-harness-workflow"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
blake3 = "1"
cel = "0.15"
dagrs = "0.9"
jensen-harness-core = { version = "0.1.0", path = "../core" }
jensen-harness-extensions = { path = "../extensions" }
jensen-harness-promote = { path = "../promote" }
jsonschema = "0.59"
petgraph = { version = "0.8", features = ["serde-1"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"

[lints]
workspace = true
