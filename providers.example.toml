default_model = "anthropic/claude-sonnet-5-5"

# A key comes from an environment variable (api_key_env) or the OS keychain
# (api_key_keychain, stored with `jensen-harness auth set <provider>`).
[providers.anthropic]
transport = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_keychain = {}

[providers.openai]
transport = "openai_compatible"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.openrouter]
transport = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.deepseek]
transport = "genai"
adapter = "deepseek"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

# A workflow names a role, never a vendor. These bind roles to models.
[roles]
explore = "anthropic/claude-sonnet-5-5"
implement = "anthropic/claude-sonnet-5-5"

# Where a publish node opens a pull request (github) or merge request
# (gitlab). The forge is picked from the host of the repository's origin.
# Set base_url for GitHub Enterprise or a self hosted GitLab. Store a token
# with `jensen-harness auth set github`.
[forges.github]
api_key_keychain = {}

[forges.gitlab]
base_url = "https://gitlab.example.com"
api_key_env = "GITLAB_TOKEN"

# Skills (Agent Skills format) are read from ~/.config/jensen-harness/skills and
# each library path's skills directory. A repository's own skills directory is
# only loaded when you allow it, because a project can ship its own prompts.
[skills]
allow_project = false

# Prices are integer micro dollars per million tokens. These are examples only:
# copy the current numbers from your provider's price list and bump the version.
[pricing]
version = "example"

[pricing.models."anthropic/claude-sonnet-5-5"]
input = 3000000
output = 15000000
cache_read = 300000
cache_write = 3750000

# Hard caps for every session unless a request sets its own. With none set,
# a session is capped at 5,000,000 tokens. The soft cap tells the model to
# wrap up; the hard cap ends the prompt.
[budget]
max_tokens = 5000000
soft_percent = 80
